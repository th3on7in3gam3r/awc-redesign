<head>

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AWC Fellowship Cookout — Sept 20, 2026" />
  <meta name="twitter:description" content="Food, fellowship, and community. Sunday, September 20 · 2:00 PM–6:00 PM. Sign up today!" />
  <meta name="twitter:image" content="https://www.anointedworshipcenter.com/images/fellowship-cookout-og.jpg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --burgundy: #4A0404;
      --gold: #D4AF37;
      --cream: #f7f2ea;
      --ink: #1c1412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 175, 55, 0.18), transparent 55%),
        linear-gradient(180deg, #fff8f0 0%, var(--cream) 45%, #efe6d8 100%);
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .brand {
      text-align: center;
      margin-bottom: 1.25rem;
    }
    .brand p {
      margin: 0;
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--burgundy);
      font-weight: 700;
      opacity: 0.85;
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      color: var(--burgundy);
      text-align: center;
      margin: 0.35rem 0 0.5rem;
      line-height: 1.15;
    }
    .sub {
      text-align: center;
      color: #5c4a42;
      font-size: 0.95rem;
      margin: 0 0 1.5rem;
      line-height: 1.45;
    }
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 1rem;
      box-shadow: 0 24px 48px rgba(74, 4, 4, 0.18);
      background: #fff;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 1rem 1.25rem;
      border-radius: 999px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--burgundy);
      color: #fff;
      box-shadow: 0 10px 24px rgba(74, 4, 4, 0.28);
    }
    .btn-secondary {
      background: transparent;
      color: var(--burgundy);
      border: 2px solid rgba(74, 4, 4, 0.25);
    }
    .meta {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #6b564c;
      line-height: 1.5;
    }
    .meta strong { color: var(--burgundy); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">
      <p>Anointed Worship Center</p>
    </div>
    <h1>Fellowship Cookout</h1>
    <p class="sub">Sunday, September 20, 2026 · 2:00 PM – 6:00 PM<br />Main Campus Grounds</p>

    <img
      class="flyer"
      src="/images/fellowship-cookout-flyer.jpg"
      width="1024"
      height="1536"
      alt="AWC Fellowship Cookout flyer — September 20, 2026"
    />

    <div class="actions">
      <a class="btn btn-primary" href="https://awc-vault.vercel.app/#/fellowship-cookout">
        Sign Up Now
      </a>
      <a class="btn btn-secondary" href="/events/fellowship-cookout/signup">
        Sign up on church site
      </a>
    </div>

    <p class="meta">
      Let us know you&apos;re coming so we can prepare enough food and fellowship for everyone.
    </p>
  </main>
</body>
</html>
